# adapted from https://github.com/xlsynth/xlsynth-crate/blob/main/.github/workflows/ci.yml

name: Rust CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # -----------------------------------------------------------
  # 1) Lint-check / pre-commit gate
  # -----------------------------------------------------------
  lint-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          cache: false

      - name: Set up Python + pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: |
          pre-commit install
          pre-commit run --all-files

  # -----------------------------------------------------------
  # 2) Build/test
  # -----------------------------------------------------------
  build-and-test:
    name: Build and test (${{ matrix.os }}, ${{ matrix.suite }})
    needs: [lint-check]  # Ensure lint checks pass first
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]  # TODO: add more OSes in the future
        suite: [stable, nightly]
        include:
          - suite: stable
            toolchain: '1.91.1'
            test-args: ''
          - suite: nightly
            toolchain: ''  # Use rust-toolchain.toml.
            test-args: '--all-features'

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Slang native libraries
        id: slang-native
        uses: ./.github/actions/setup-slang-native

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: ${{ matrix.toolchain }}
          cache-shared-key: slang-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.slang-native.outputs.sha256 }}-${{ steps.slang-native.outputs.compiler-key }}

      - name: Install tools for cross-emitter proofs and simulation
        if: matrix.suite == 'nightly'
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys iverilog

      - name: Run correctness tests
        run: cargo test --locked ${{ matrix.test-args }}

      - name: Check out Bedrock's pipeline RTL
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: xlsynth/bedrock-rtl
          ref: 283a06fad75eacf0d45a5936c69c2fdd9728e2ad
          path: target/bedrock-rtl
          sparse-checkout: |
            delay/rtl
            macros
          persist-credentials: false

      - name: Check the pipeline interface against Bedrock
        run: cargo test --locked --test bedrock_pipeline -- --include-ignored

      - name: Run performance tests
        run: cargo test --locked ${{ matrix.test-args }} --release performance_ -- --test-threads=1 --show-output

      - name: Check DEF export performance
        shell: bash
        run: |
          cargo test --locked --release --test def_export_performance -- --nocapture 2>&1 |
            sed '/ DEF export took /s/^/::notice::/'

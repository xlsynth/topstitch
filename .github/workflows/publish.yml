# SPDX-License-Identifier: Apache-2.0

# adapted from https://github.com/xlsynth/xlsynth-crate/blob/main/.github/workflows/publish.yml

name: Publish to crates.io

on:
  push:
    tags:
      - 'v*' # This will trigger the workflow on version tags like v1.0.0, v0.1.0, etc.

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: Deploy
    env:
      CC: gcc
      CXX: g++

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Validate version matches
      run: |
        # GITHUB_REF will be something like "refs/tags/v0.0.57"
        # We'll strip off the "refs/tags/" part, leaving "v0.0.57".
        VERSION="${GITHUB_REF#refs/tags/}"

        # Now invoke the Python script, passing the version.
        python check_version_is.py "$VERSION"

    - name: Install native build prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake python3

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
      with:
        toolchain: 1.91.1
        cache: false

    - name: Build and test
      run: cargo test --locked

    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe

    - name: Publish topstitch to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        cargo publish --locked

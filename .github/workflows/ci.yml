# adapted from https://github.com/xlsynth/xlsynth-crate/blob/main/.github/workflows/ci.yml

name: Rust CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # -----------------------------------------------------------
  # 1) Lint-check / pre-commit gate
  # -----------------------------------------------------------
  lint-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python + pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: |
          pre-commit install
          pre-commit run --all-files

  # -----------------------------------------------------------
  # 2) Build/test
  # -----------------------------------------------------------
  build-and-test:
    needs: [lint-check]  # Ensure lint checks pass first
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]  # TODO: add more OSes in the future
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download Slang
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/MikePopoloski/slang/releases/download/v11.0/slang-linux-x86_64.tar.gz"
          echo "951a170e10e25e54c91565030acfdfc11c3226714ebf225a18ad4166a898d8a4  $RUNNER_TEMP/slang.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/slang"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6

      - name: Install libc++ runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++1 libc++abi1 || \
          sudo apt-get install -y libc++1-18 libc++abi1-18 || \
          sudo apt-get install -y libc++1-14 libc++abi1-14

      - name: Run tests
        run: SLANG_PATH="$RUNNER_TEMP/slang" cargo test --locked
